<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Cupos disponibles</title>
<style>
  /* Una sola capa, sin dependencias: esta página la abre gente de otra empresa en su
     celular, muchas veces con mala señal. Cero fuentes externas, cero librerías. */
  :root{
    --bg:#f6f7f9; --card:#fff; --tx:#12151a; --mini:#697080; --line:#e4e7ec;
    --ok:#0f7b47; --okbg:#e7f6ee; --casi:#8a5a00; --casibg:#fdf3e0; --no:#a02020; --nobg:#fbeaea;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1216; --card:#171b21; --tx:#eef1f5; --mini:#98a1b0; --line:#252b34;
           --ok:#5fd39a; --okbg:#12291f; --casi:#e8b45e; --casibg:#2a2113; --no:#f08a8a; --nobg:#2c1717; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;padding:16px 14px 40px}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--mini);font-size:13px;margin:0 0 16px}
  .dia{margin:18px 0 8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mini)}
  .c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;
     display:flex;align-items:center;gap:12px}
  /* la hora en dos líneas ("7:00" / "a.m.") deja el ancho para el nombre de la clase */
  .h{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;flex:0 0 auto;width:46px;line-height:1.15}
  .h span{display:block;font-size:11px;font-weight:600;color:var(--mini)}
  .m{flex:1;min-width:0}
  /* NUNCA cortar el nombre: entre "Máquinas · Reformer" y "Máquinas · Tower" está toda la
     diferencia para quien lee esta página, así que se parte en dos líneas antes que truncar. */
  .n{font-weight:600;overflow-wrap:anywhere}
  .s{color:var(--mini);font-size:12.5px}
  .b{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .b.ok{color:var(--ok);background:var(--okbg)}
  .b.casi{color:var(--casi);background:var(--casibg)}
  .b.no{color:var(--no);background:var(--nobg)}
  .vacio{color:var(--mini);text-align:center;padding:36px 10px}
  .pie{color:var(--mini);font-size:12px;text-align:center;margin-top:26px;line-height:1.6}
  .err{background:var(--nobg);color:var(--no);border-radius:10px;padding:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="tit">Cupos disponibles</h1>
  <p class="sub" id="sub">Cargando…</p>
  <div id="cont"></div>
  <p class="pie" id="pie"></p>
</div>
<script>
(function(){
  var slug=(location.pathname.split("/app/d/")[1]||"").replace(/\/+$/,"").trim();
  var cont=document.getElementById("cont"), sub=document.getElementById("sub"), pie=document.getElementById("pie");
  var DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  var MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  /* Lima = UTC-5 fijo, igual que en todo el resto del sistema */
  function lima(iso){ var d=new Date(Date.parse(iso)-5*3600000); return d; }
  function hhmm(d){ var h=d.getUTCHours(), m=d.getUTCMinutes();
    var ap=h<12?"a.m.":"p.m."; var h12=h%12; if(h12===0) h12=12;
    return h12+":"+String(m).padStart(2,"0")+" "+ap; }
  /* la hora partida: número arriba, a.m./p.m. debajo y chiquito */
  function hCelda(d){ var p=hhmm(d).split(" ");
    return esc(p[0])+'<span>'+esc(p[1]||"")+'</span>'; }
  function fkey(d){ return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
  function titDia(d, hoyK){
    var k=fkey(d);
    var pre = k===hoyK ? "Hoy · " : "";
    return pre+DIAS[d.getUTCDay()]+" "+d.getUTCDate()+" de "+MES[d.getUTCMonth()];
  }
  function pinta(data){
    var franjas=data.franjas||{}, isos=Object.keys(franjas).sort();
    var hoyK=fkey(lima(new Date().toISOString()));
    var html="", diaActual="", total=0, libres=0;
    isos.forEach(function(iso){
      var lista=franjas[iso]||[]; if(!lista.length) return;
      var d=lima(iso), k=fkey(d);
      if(k!==diaActual){ diaActual=k; html+='<div class="dia">'+esc(titDia(d,hoyK))+'</div>'; }
      lista.forEach(function(f){
        var cupo=Number(f.cupo)||0, oc=Number(f.ocupados)||0;
        var q=Math.max(0,cupo-oc); total++; if(q>0) libres++;
        var cls=q<=0?"no":(q<=1?"casi":"ok");
        var txt=q<=0?"lleno":(q===1?"1 cupo":q+" cupos");
        var sala=(f.sala||"").trim();
        html+='<div class="c"><div class="h">'+hCelda(d)+'</div><div class="m">'+
              '<div class="n">'+esc(f.curso||"Clase")+'</div>'+
              (sala?'<div class="s">'+esc(sala)+'</div>':'')+
              '</div><div class="b '+cls+'">'+esc(txt)+'</div></div>';
      });
    });
    if(!total){ cont.innerHTML='<div class="vacio">No hay clases publicadas por ahora.</div>'; sub.textContent=""; return; }
    cont.innerHTML=html;
    sub.textContent=libres+" de "+total+" clases con cupo";
    var ah=lima(new Date().toISOString());
    pie.textContent="Actualizado a las "+hhmm(ah)+" (hora de Lima). Se refresca solo cada 2 minutos.";
  }
  function cargar(){
    if(!slug){ cont.innerHTML='<div class="err">Falta el nombre de la academia en el enlace.</div>'; sub.textContent=""; return; }
    fetch("/app/api/agenda/slots-publicos?slug="+encodeURIComponent(slug)+"&_="+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error){ cont.innerHTML='<div class="err">'+esc(d.error)+'</div>'; sub.textContent=""; return; }
        pinta(d);
      })
      .catch(function(){ cont.innerHTML='<div class="err">No se pudo cargar. Revisa tu conexión y vuelve a intentar.</div>'; sub.textContent=""; });
  }
  cargar();
  setInterval(cargar, 120000);
  /* al volver a la pestaña, refresca: quien la deja abierta no debe ver datos viejos */
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) cargar(); });
})();
</script>
</body>
</html>
