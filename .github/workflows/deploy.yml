name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d6762650e83c09d554b1e3413c03b43d
      - name: smoke post-deploy (la web responde y sirve la marca)
        run: |
          set -e
          for i in 1 2 3; do code=$(curl -s -o /tmp/home.html -w '%{http_code}' https://profesormvt.com/) && [ "$code" = "200" ] && break; sleep 10; done
          [ "$code" = "200" ] || { echo "home devolvió $code"; exit 1; }
          grep -qi 'ProfesorMVT' /tmp/home.html || { echo "la home no contiene la marca"; exit 1; }
          echo "smoke OK: 200 y marca presente"
